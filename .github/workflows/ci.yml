name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  # Secretless analysis: GitHub OIDC is exchanged for a 30-minute SonarQube Cloud token.
  # Fork PRs are skipped because GitHub does not grant id-token there.
  sonar:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: SonarSource/sonarqube-auth-action@v1.2
      - uses: SonarSource/sonarqube-scan-action@v8.5.1
