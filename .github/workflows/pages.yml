name: Publish OpenAPI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: austral
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: austral_ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U austral -d austral_ledger"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.8.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://austral@localhost:5432/austral_ledger
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
      - name: Generate throwaway secrets
        # Random per run, masked in logs; the job only serves the API description.
        run: |
          pepper=$(openssl rand -hex 32)
          webhook_key=$(openssl rand -base64 32)
          echo "::add-mask::$pepper"
          echo "::add-mask::$webhook_key"
          echo "API_KEY_PEPPER=$pepper" >> "$GITHUB_ENV"
          echo "WEBHOOK_SECRET_KEY=$webhook_key" >> "$GITHUB_ENV"
      - name: Export the OpenAPI document from the running API
        run: |
          node dist/main.js &
          for _ in $(seq 1 30); do
            curl -fs http://localhost:3000/health > /dev/null && break
            sleep 1
          done
          mkdir site
          curl -fs http://localhost:3000/docs-json -o site/openapi.json
      - name: Render static reference
        run: npx --yes --ignore-scripts @redocly/cli@2.83.0 build-docs site/openapi.json --output site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
